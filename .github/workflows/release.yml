name: Release

on:
  push:
    tags: ['v*']        # e.g. v1.2.0

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write       # needed to create the GitHub Release

env:
  APP_NAME: Lucerne

jobs:
  release:
    name: Build & publish (unsigned)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Select a recent Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app || true

      - name: Install packaging tooling
        run: brew install create-dmg

      - name: Version from tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Verify the tag matches the committed version
        # Guards against tagging a commit whose committed version markers were never
        # bumped (Scripts/release.sh bumps all of them; a hand-cut tag can skip them).
        # Runs BEFORE the plist is stamped from the tag, so it sees the committed values.
        run: |
          PLIST_VERSION="$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" Scripts/Info.plist)"
          README_VERSION="$(sed -n 's/.*<!-- version -->\(.*\)<!-- \/version -->.*/\1/p' README.md | head -1)"
          CMAKE_VERSION="$(sed -n 's/^project(lucerne VERSION \([0-9.]*\).*/\1/p' linux/CMakeLists.txt | head -1)"
          fail=0
          if [ "$PLIST_VERSION" != "$VERSION" ]; then
            echo "::error::tag version ($VERSION) != Scripts/Info.plist CFBundleShortVersionString ($PLIST_VERSION); bump the plist (Scripts/release.sh does this) before tagging."
            fail=1
          fi
          if [ "$README_VERSION" != "$VERSION" ]; then
            echo "::error::tag version ($VERSION) != README version marker ($README_VERSION); bump the README version line before tagging."
            fail=1
          fi
          if [ "$CMAKE_VERSION" != "$VERSION" ]; then
            echo "::error::tag version ($VERSION) != linux/CMakeLists.txt project version ($CMAKE_VERSION); bump it (Scripts/release.sh does this) before tagging."
            fail=1
          fi
          [ "$fail" -eq 0 ] || exit 1

      - name: Stamp the bundle version from the tag
        run: |
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $VERSION" Scripts/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${{ github.run_number }}" Scripts/Info.plist

      - name: Test
        # Gate the release on the unit tests — a tag can land on a commit whose CI
        # run is still in flight (or never ran), so re-run them here before publishing.
        run: swift test -v

      - name: Build the app bundle
        # Builds Release, assembles dist/Lucerne.app, and ad-hoc signs it (identity "-").
        # That isn't a Developer ID signature and the app is not notarized, but it IS
        # required to launch on Apple Silicon; Gatekeeper still warns on first open.
        run: Scripts/make-app.sh

      - name: Package zip + DMG
        run: |
          APP="dist/$APP_NAME.app"
          [ -d "$APP" ] || { echo "::error::built $APP_NAME.app not found"; exit 1; }
          ZIP="$RUNNER_TEMP/$APP_NAME-$VERSION.zip"
          DMG="$RUNNER_TEMP/$APP_NAME-$VERSION.dmg"
          ditto -c -k --keepParent "$APP" "$ZIP"
          # create-dmg can exit non-zero on a headless runner even on success — verify the file.
          create-dmg \
            --volname "$APP_NAME $VERSION" \
            --window-size 540 380 \
            --icon-size 100 \
            --icon "$APP_NAME.app" 150 185 \
            --app-drop-link 390 185 \
            "$DMG" "$APP" || true
          [ -f "$DMG" ] || { echo "::error::DMG was not created"; exit 1; }
          echo "ZIP=$ZIP" >> "$GITHUB_ENV"
          echo "DMG=$DMG" >> "$GITHUB_ENV"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ env.APP_NAME }} ${{ env.VERSION }}
          files: |
            ${{ env.DMG }}
            ${{ env.ZIP }}
          generate_release_notes: true
          body: |
            ### macOS: unsigned build

            The Mac app is **not** code-signed with a Developer ID or notarized, so
            macOS Gatekeeper will warn on first launch. To open it:

            - **Right-click** (or Control-click) the app → **Open** → **Open**, or
            - run `xattr -dr com.apple.quarantine /Applications/${{ env.APP_NAME }}.app`

            ### Linux

            - **`lucerne_<version>_amd64.deb`** — for Ubuntu 24.04+ (`sudo apt install ./lucerne_*.deb`)
            - **`lucerne-x86_64.AppImage`** — for any current distro (`chmod +x`, then run)

            `.luce` files are fully compatible between the Mac and Linux apps.

  release-linux-deb:
    name: Build & attach .deb (Ubuntu 24.04)
    # After the macOS job: it creates the release (name, body, generated
    # notes) — attaching first would win the softprops create-race with a
    # bare release, and Linux artifacts must not publish if the gate fails.
    needs: release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt 6 and build tooling
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            qt6-base-dev qt6-base-dev-tools libqt6svg6-dev libgl1-mesa-dev zlib1g-dev \
            ninja-build dpkg-dev

      - name: Build, test, package
        run: |
          cmake -S linux -B linux/build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build linux/build
          QT_QPA_PLATFORM=offscreen ctest --test-dir linux/build --output-on-failure
          cd linux/build && cpack -G DEB

      - name: Verify the package installs and launches
        # The same smoke test the CI workflow runs — a released .deb must
        # never be weaker-checked than a CI one.
        run: |
          sudo apt-get install -y ./linux/build/lucerne_*_amd64.deb
          QT_QPA_PLATFORM=offscreen lucerne --version

      - name: Attach to the GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: linux/build/lucerne_*_amd64.deb

  release-linux-appimage:
    name: Build & attach AppImage (Ubuntu 22.04)
    needs: release
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt 6 and build tooling
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            qt6-base-dev qt6-base-dev-tools libqt6svg6-dev libgl1-mesa-dev zlib1g-dev \
            ninja-build libfuse2 libxkbcommon-x11-0 qt6-wayland qt6-wayland-dev

      - name: Build, test, assemble AppImage
        run: |
          cmake -S linux -B linux/build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build linux/build
          QT_QPA_PLATFORM=offscreen ctest --test-dir linux/build --output-on-failure
          cmake --install linux/build --prefix linux/build/AppDir/usr
          cd linux/build
          curl -fsSLO https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          curl -fsSLO https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy-x86_64.AppImage linuxdeploy-plugin-qt-x86_64.AppImage
          export QMAKE=/usr/bin/qmake6
          # Deploy the SVG icon engine: QIcon::fromTheme loads it at
          # runtime, so nothing in the binary references it and
          # linuxdeploy would otherwise leave every themed icon blank.
          export EXTRA_QT_MODULES="svg"
          # Bundle wayland + offscreen alongside xcb so the AppImage feels at
          # home on modern GNOME sessions and stays testable headless.
          export EXTRA_PLATFORM_PLUGINS="libqwayland-generic.so;libqwayland-egl.so;libqoffscreen.so"
          ./linuxdeploy-x86_64.AppImage --appdir AppDir --plugin qt --output appimage
          mv Lucerne*.AppImage lucerne-x86_64.AppImage

      - name: Smoke-run the AppImage
        run: |
          cd linux/build
          # No FUSE in CI containers is common; extract-and-run sidesteps it.
          QT_QPA_PLATFORM=offscreen ./lucerne-x86_64.AppImage --appimage-extract-and-run --version

      - name: Attach to the GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: linux/build/lucerne-x86_64.AppImage
